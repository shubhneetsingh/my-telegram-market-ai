services:
  - type: web
    name: telegram-ai-market-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: nvidia
      - key: AI_MODEL
        value: meta/llama-3.2-11b-vision-instruct
